name: build

on:
  push:
  pull_request:

jobs:
  build-aarch64:
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4

      - name: build the aarch64 build image
        run: docker build -t steamos-efi-build .

      - name: build (inside the arm64 image)
        run: docker run --rm -v "$PWD":/src -w /src steamos-efi-build bash ci/build.sh

      - name: smoke check artifacts
        run: |
          file steamcl.efi holo-bootconf
          file steamcl.efi | grep -q "ARM64"
          file holo-bootconf | grep -q "statically linked"

      - uses: actions/upload-artifact@v4
        with:
          name: steamos-efi-aarch64
          path: |
            steamcl.efi
            holo-bootconf
            data/steamcl-version
            fonts/default.pf2
