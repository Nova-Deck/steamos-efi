name: build

on:
  push:
  pull_request:

jobs:
  cross-build-aarch64:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install cross toolchain + deps
        run: |
          sudo dpkg --add-architecture arm64
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            gnu-efi:arm64 \
            libc6-dev-arm64-cross \
            gcc-aarch64-linux-gnu \
            autoconf automake libtool pkg-config \
            fontconfig fonts-dejavu-core \
            grub-common
      - name: Autoreconf + configure
        run: |
          autoreconf -ivf
          ./configure --host=aarch64-linux-gnu --with-release-version=ci
      - name: Build
        run: make -j"$(nproc)"
      - name: Smoke check artifacts
        run: |
          file steamcl.efi holo-bootconf
          file steamcl.efi | grep -q "ARM64"
          file holo-bootconf | grep -q "statically linked"
      - uses: actions/upload-artifact@v4
        with:
          name: steamos-efi-aarch64
          path: |
            steamcl.efi
            holo-bootconf
            data/steamcl-version
            fonts/default.pf2
